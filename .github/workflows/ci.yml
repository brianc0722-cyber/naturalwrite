name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        # The build only needs DATABASE_URL to be present and parseable;
        # no queries run at build time.
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
        run: npm run build

